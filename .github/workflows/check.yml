name: Check and build userscript
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check committed userscript matches source
        run: git diff --exit-code -- dist/playlist-sort.user.js
      - name: Run browser fixture tests
        run: |
          FIREFOX_BIN="$(command -v firefox)"
          CHROMIUM_BIN="$(command -v google-chrome)"
          export FIREFOX_BIN CHROMIUM_BIN
          "$FIREFOX_BIN" --version
          "$CHROMIUM_BIN" --version
          npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playlist-sort-userscript
          path: dist/playlist-sort.user.js
